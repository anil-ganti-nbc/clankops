[project]
name = "clankops"
version = "0.2.0"
description = "Development control plane and institutional memory for the Clank ecosystem"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
desktop = ["pywebview==6.2.1"]
desktop-build = ["pyinstaller>=6.22,<7"]

[project.scripts]
clankctl = "clankops.cli:main"
clankops-desktop = "clankops.desktop:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
